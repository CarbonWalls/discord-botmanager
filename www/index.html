<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="app.title"></title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" data-theme="auto">
<header class="topbar">
<div class="topbar-left">
<button class="icon-btn" id="menu-toggle" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button>
<h1 class="brand" data-i18n="app.title"></h1>
</div>
<div class="topbar-center">
<nav class="tabs" role="tablist" id="main-tabs"></nav>
</div>
<div class="topbar-right">
<select id="lang-select" class="lang-select" aria-label="Language"></select>
<button class="icon-btn" id="theme-toggle" aria-label="Toggle theme"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
<button class="icon-btn" id="lock-btn" aria-label="Lock vault"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></button>
</div>
</header>

<aside class="sidebar" id="sidebar" role="complementary">
<div class="sidebar-header">
<h2 data-i18n="nav.tokens"></h2>
<button class="btn btn-primary btn-sm" id="add-bot-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span data-i18n="vault.add"></span></button>
</div>
<div class="bot-list" id="bot-list"></div>
</aside>

<div class="backdrop" id="backdrop"></div>

<main class="main" id="main-content">
<section class="panel" id="panel-unlock" role="region" aria-label="Unlock">
<div class="panel-content">
<h2 id="unlock-title" data-i18n="unlock.create_title"></h2>
<p class="panel-desc" id="unlock-desc" data-i18n="unlock.create_desc"></p>
<form id="unlock-form" class="form-stack">
<div class="form-field">
<label for="pw" data-i18n="unlock.master_password"></label>
<input type="password" id="pw" autocomplete="new-password" required>
</div>
<div class="form-field" id="pw2-field">
<label for="pw2" data-i18n="unlock.repeat_password"></label>
<input type="password" id="pw2" autocomplete="new-password">
</div>
<button type="submit" class="btn btn-primary btn-block" id="submit-btn" data-i18n="unlock.create"></button>
<div class="error hidden" id="unlock-error"></div>
</form>
</div>
</section>

<section class="panel hidden" id="panel-vault" role="region" aria-label="Vault">
<div class="panel-header">
<h2 data-i18n="vault.title"></h2>
</div>
<div class="bot-cards" id="bot-cards"></div>
</section>

<section class="panel hidden" id="panel-send" role="region" aria-label="Send">
<div class="panel-header">
<h2 data-i18n="send.title"></h2>
</div>
<div class="grid grid-2">
<div class="card">
<h3 data-i18n="send.bot"></h3>
<select id="send-bot" class="select"><option value="" data-i18n-key="select.bot"></option></select>
</div>
<div class="card">
<h3 data-i18n="send.destination"></h3>
<div class="segmented" id="send-mode">
<button class="seg-btn active" data-mode="auto" data-i18n="send.from_servers"></button>
<button class="seg-btn" data-mode="manual" data-i18n="send.manual_id"></button>
</div>
</div>
</div>
<div id="send-auto" class="grid grid-2">
<div class="card">
<h3 data-i18n="send.guild"></h3>
<select id="send-guild" class="select" disabled><option data-i18n-key="select.bot_first"></option></select>
</div>
<div class="card">
<h3 data-i18n="send.channel"></h3>
<select id="send-chan" class="select" disabled><option data-i18n-key="select.server"></option></select>
</div>
</div>
<div id="send-manual" class="card hidden">
<h3 data-i18n="send.channel_id"></h3>
<input type="text" id="send-manual-chan" class="input mono" data-i18n-placeholder="send.channel_id_placeholder">
</div>
<div class="card">
<h3 data-i18n="send.content"></h3>
<textarea id="send-content" class="input textarea" data-i18n-placeholder="send.content_placeholder" rows="4"></textarea>
<div class="card-footer">
<label class="checkbox-inline"><input type="checkbox" id="send-voice-msg"><span data-i18n="send.voice_message"></span></label>
<label class="checkbox-inline"><input type="checkbox" id="send-embed-toggle"><span data-i18n="send.embed"></span></label>
</div>
</div>
<div id="send-voice-form" class="card hidden">
<div class="segmented" id="voice-mode">
<button class="seg-btn active" data-mode="upload" data-i18n="send.voice_upload"></button>
<button class="seg-btn" data-mode="record" data-i18n="send.voice_record"></button>
</div>
<div id="voice-upload" class="form-field">
<input type="file" id="voice-file" accept=".ogg,.opus,audio/ogg,audio/opus" class="input file-input">
<audio id="voice-file-preview" controls class="hidden"></audio>
</div>
<div id="voice-record" class="form-field hidden">
<div class="btn-row">
<button class="btn btn-ghost" id="voice-record-start" data-i18n="send.voice_start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg></button>
<button class="btn btn-danger hidden" id="voice-record-stop" data-i18n="send.voice_stop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
</div>
<div class="muted small" id="voice-record-status"></div>
<audio id="voice-record-preview" controls class="hidden"></audio>
</div>
<div class="form-field">
<label data-i18n="send.voice_waveform"></label>
<select id="voice-waveform" class="select">
<option value="auto" data-i18n-key="send.waveform_auto"></option>
<option value="constant" data-i18n-key="send.waveform_constant"></option>
<option value="none" data-i18n-key="send.waveform_none"></option>
</select>
<p class="muted small" data-i18n="send.voice_waveform_note"></p>
</div>
<div class="form-field">
<label data-i18n="send.voice_filename"></label>
<input type="text" id="voice-filename" class="input" data-i18n-placeholder="send.voice_filename_placeholder">
</div>
</div>
<div id="send-embed-form" class="card hidden">
<div class="form-field"><label data-i18n="send.embed_title"></label><input type="text" id="e-title" class="input" maxlength="256"></div>
<div class="form-field"><label data-i18n="send.embed_title_url"></label><input type="url" id="e-url" class="input"></div>
<div class="form-field"><label data-i18n="send.embed_desc"></label><textarea id="e-desc" class="input textarea" maxlength="4096" rows="3"></textarea></div>
<div class="grid grid-2">
<div class="form-field"><label data-i18n="send.embed_color"></label><input type="color" id="e-color" class="input color-input" value="#2563eb"></div>
<div class="form-field"><label data-i18n="send.embed_timestamp"></label><select id="e-ts" class="select"><option value="" data-i18n-key="send.ts_none"></option><option value="now" data-i18n-key="send.ts_now"></option></select></div>
</div>
<div class="form-field"><label data-i18n="send.embed_author_name"></label><input type="text" id="e-aname" class="input" maxlength="256"></div>
<div class="form-field"><label data-i18n="send.embed_author_icon"></label><input type="url" id="e-aicon" class="input"></div>
<div class="form-field"><label data-i18n="send.embed_image"></label><input type="url" id="e-img" class="input"></div>
<div class="form-field"><label data-i18n="send.embed_thumbnail"></label><input type="url" id="e-thumb" class="input"></div>
<div class="form-field"><label data-i18n="send.embed_footer"></label><input type="text" id="e-footer" class="input" maxlength="2048"></div>
<div class="form-field"><label data-i18n="send.embed_footer_icon"></label><input type="url" id="e-ficon" class="input"></div>
<div class="form-field">
<label data-i18n="send.embed_fields"></label>
<div id="e-fields"></div>
<button class="btn btn-ghost btn-sm" id="e-addfield" data-i18n="send.embed_add_field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
</div>
</div>
<div class="card">
<h3 data-i18n="send.preview"></h3>
<div class="preview" id="send-preview"></div>
</div>
<div class="card-footer">
<input type="file" id="send-attachment" accept="image/*,video/*" class="hidden">
<button class="btn btn-ghost" type="button" id="send-attach-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.49"/></svg><span data-i18n="send.attachment"></span></button>
<div class="file-preview" id="send-file-preview"></div>
</div>
<button class="btn btn-primary btn-block" id="send-btn" data-i18n="send.send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
<div class="error hidden" id="send-error"></div>
</section>

<section class="panel hidden" id="panel-logs" role="region" aria-label="Archive">
<div class="panel-header">
<h2 data-i18n="logs.title"></h2>
</div>
<div class="card">
<div class="grid grid-3">
<div class="form-field"><label data-i18n="logs.bot"></label><select id="log-bot" class="select"><option value="" data-i18n-key="select.bot"></option></select></div>
<div class="form-field"><label data-i18n="logs.guild"></label><select id="log-guild" class="select" disabled><option data-i18n-key="select.bot_first"></option></select></div>
<div class="form-field"><label data-i18n="logs.channel"></label><select id="log-chan" class="select" disabled><option data-i18n-key="select.server"></option></select></div>
</div>
<div class="btn-row">
<button class="btn btn-primary" id="log-rest" disabled data-i18n="logs.load_rest"></button>
<button class="btn btn-ghost" id="log-archive" disabled data-i18n="logs.load_archive"></button>
</div>
<p class="muted small" data-i18n="logs.info"></p>
<div class="error hidden" id="log-error"></div>
</div>
<div class="card log-feed" id="log-feed">
<div class="muted center" data-i18n="logs.select_channel"></div>
</div>
</section>

<section class="panel hidden" id="panel-presence" role="region" aria-label="Presence">
<div class="panel-header">
<h2 data-i18n="presence.title"></h2>
</div>
<div class="card info-card">
<svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
<div><strong data-i18n="presence.info_title"></strong><p data-i18n="presence.info_desc"></p></div>
</div>
<div class="card">
<div class="form-field"><label data-i18n="presence.bot"></label><select id="presence-bot" class="select"><option value="" data-i18n-key="select.bot"></option></select></div>
<div class="form-field"><label data-i18n="presence.status"></label><select id="presence-status" class="select"><option value="online" data-i18n-key="presence.online"></option><option value="idle" data-i18n-key="presence.idle"></option><option value="dnd" data-i18n-key="presence.dnd"></option><option value="invisible" data-i18n-key="presence.invisible"></option></select></div>
<div class="form-field"><label data-i18n="presence.activity"></label><input type="text" id="presence-activity" class="input" data-i18n-placeholder="presence.activity_placeholder"></div>
<div class="btn-row">
<button class="btn btn-primary" id="presence-apply" disabled data-i18n="presence.apply"></button>
<button class="btn btn-ghost" id="presence-disc" disabled data-i18n="presence.disconnect"></button>
</div>
<div class="error hidden" id="presence-error"></div>
</div>
<div class="card">
<h3 data-i18n="presence.sessions"></h3>
<div id="presence-sessions" class="muted small" data-i18n="presence.no_sessions"></div>
</div>
</section>

<section class="panel hidden" id="panel-voice" role="region" aria-label="Voice">
<div class="panel-header">
<h2 data-i18n="voice.title"></h2>
</div>
<div class="card info-card">
<svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
<div><strong data-i18n="voice.info_title"></strong><p data-i18n="voice.info_desc"></p></div>
</div>
<div class="card">
<div class="grid grid-3">
<div class="form-field"><label data-i18n="voice.bot"></label><select id="voice-bot" class="select"><option value="" data-i18n-key="select.bot"></option></select></div>
<div class="form-field"><label data-i18n="voice.guild"></label><select id="voice-guild" class="select" disabled><option data-i18n-key="select.bot_first"></option></select></div>
<div class="form-field"><label data-i18n="voice.channel"></label><select id="voice-chan" class="select" disabled><option data-i18n-key="select.server"></option></select></div>
</div>
<div class="grid grid-3">
<div class="form-field"><label data-i18n="voice.auto_leave"></label><input type="number" id="voice-autoleave" class="input" value="0" min="0" max="1440" step="1"></div>
<div class="form-field checkbox-field"><label class="checkbox-inline"><input type="checkbox" id="voice-mute"><span data-i18n="voice.self_mute"></span></label></div>
<div class="form-field checkbox-field"><label class="checkbox-inline"><input type="checkbox" id="voice-deaf"><span data-i18n="voice.self_deaf"></span></label></div>
</div>
<div class="btn-row">
<button class="btn btn-primary" id="voice-join" disabled data-i18n="voice.join"></button>
<button class="btn btn-ghost" id="voice-leave" disabled data-i18n="voice.leave"></button>
<button class="btn btn-ghost" id="voice-refresh" data-i18n="voice.refresh"></button>
</div>
<div class="error hidden" id="voice-error"></div>
</div>
<div class="card">
<h3 data-i18n="voice.status"></h3>
<div id="voice-status" class="status-display"></div>
</div>
<div class="card">
<h3 data-i18n="voice.playback_title"></h3>
<p class="muted small" data-i18n="voice.playback_desc"></p>
<div class="form-field"><label data-i18n="voice.playback_file"></label><input type="file" id="voice-play-file" accept="audio/*,.mp3,.wav,.ogg,.opus,.m4a,.flac" class="input file-input"></div>
<div id="voice-play-preview" class="hidden"><audio id="voice-play-audio" controls></audio></div>
<div class="btn-row">
<button class="btn btn-primary" id="voice-play" disabled data-i18n="voice.play"></button>
<button class="btn btn-ghost" id="voice-stop" disabled data-i18n="voice.stop_playback"></button>
</div>
<div class="muted small" id="voice-play-status"></div>
</div>
</section>

<section class="panel hidden" id="panel-cleaner" role="region" aria-label="Cleaner">
<div class="panel-header">
<h2 data-i18n="cleaner.title"></h2>
</div>
<div class="card warn-card">
<svg class="warn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
<div><strong data-i18n="cleaner.warning"></strong><p data-i18n-html="cleaner.warning_desc"></p></div>
</div>
<div class="card">
<div class="grid grid-3">
<div class="form-field"><label data-i18n="cleaner.bot"></label><select id="clean-bot" class="select"><option value="" data-i18n-key="select.bot"></option></select></div>
<div class="form-field"><label data-i18n="cleaner.guild"></label><select id="clean-guild" class="select" disabled><option data-i18n-key="select.bot_first"></option></select></div>
<div class="form-field"><label data-i18n="cleaner.channel"></label><select id="clean-chan" class="select" disabled><option data-i18n-key="select.server"></option></select></div>
</div>
<div class="form-field"><label data-i18n="cleaner.selected"></label><code id="clean-target" class="mono"></code></div>
</div>
<div class="card">
<h3 data-i18n="cleaner.clone_title"></h3>
<p class="muted small" data-i18n="cleaner.clone_desc"></p>
<button class="btn btn-danger btn-block" id="clean-clone" data-i18n="cleaner.clone"></button>
</div>
<div class="card">
<h3 data-i18n="cleaner.delete_all_title"></h3>
<p class="muted small" data-i18n="cleaner.delete_all_desc"></p>
<button class="btn btn-danger btn-block" id="clean-delete" data-i18n="cleaner.delete_all"></button>
<div class="progress hidden" id="clean-progress"><div class="progress-bar"></div></div>
<div class="progress-text hidden" id="clean-progress-text"></div>
</div>
</section>

<section class="panel hidden" id="panel-settings" role="region" aria-label="Settings">
<div class="panel-header">
<h2 data-i18n="settings.title"></h2>
</div>
<div class="card">
<h3 data-i18n="settings.autolock"></h3>
<p class="muted small" data-i18n="settings.autolock_desc"></p>
<div class="segmented" id="autolock-seg">
<button class="seg-btn" data-v="0" data-i18n="settings.never"></button>
<button class="seg-btn" data-v="1" data-i18n="settings.min_1"></button>
<button class="seg-btn active" data-v="5" data-i18n="settings.min_5"></button>
<button class="seg-btn" data-v="15" data-i18n="settings.min_15"></button>
</div>
</div>
<div class="card">
<h3 data-i18n="settings.language"></h3>
<p class="muted small" data-i18n="settings.language_desc"></p>
<select id="lang-setting" class="select"></select>
</div>
<div class="card">
<h3 data-i18n="settings.theme"></h3>
<p class="muted small" data-i18n="settings.theme_desc"></p>
<div class="segmented" id="theme-seg">
<button class="seg-btn" data-v="light" data-i18n="settings.light"></button>
<button class="seg-btn" data-v="dark" data-i18n="settings.dark"></button>
<button class="seg-btn active" data-v="auto" data-i18n="settings.auto"></button>
</div>
</div>
<div class="card">
<h3 data-i18n="settings.master_password"></h3>
<p class="muted small" data-i18n="settings.master_password_desc"></p>
<button class="btn btn-ghost btn-block" id="changepw-btn" data-i18n="settings.change_master_password"></button>
</div>
<div class="card danger-zone">
<h3 data-i18n="settings.danger_zone"></h3>
<p class="muted small" data-i18n="settings.danger_desc"></p>
<button class="btn btn-danger btn-block" id="reset-vault" data-i18n="settings.reset_vault"></button>
</div>
<p class="footer-note" data-i18n="settings.footer"></p>
</section>
</main>

<div class="modal hidden" id="modal-generic" role="dialog" aria-modal="true">
<div class="modal-backdrop"></div>
<div class="modal-box">
<button class="modal-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
<h3 id="modal-title"></h3>
<p class="muted small" id="modal-desc"></p>
<div id="modal-body"></div>
<div class="modal-actions">
<button class="btn btn-ghost" id="modal-cancel" data-i18n="common.cancel"></button>
<button class="btn btn-primary" id="modal-confirm" data-i18n="common.confirm"></button>
</div>
</div>
</div>

<div class="modal hidden" id="modal-changepw" role="dialog" aria-modal="true">
<div class="modal-backdrop"></div>
<div class="modal-box">
<button class="modal-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
<h3 data-i18n="settings.change_master_password"></h3>
<p class="muted small" data-i18n="settings.change_pw_desc"></p>
<form id="changepw-form" class="form-stack">
<div class="form-field"><label data-i18n="settings.current_pw"></label><input type="password" id="cpw-old" class="input" required></div>
<div class="form-field"><label data-i18n="settings.new_pw"></label><input type="password" id="cpw-new" class="input" required minlength="8"></div>
<div class="form-field"><label data-i18n="settings.repeat_pw"></label><input type="password" id="cpw-new2" class="input" required></div>
<div class="error hidden" id="changepw-error"></div>
<div class="modal-actions">
<button type="button" class="btn btn-ghost" data-i18n="common.cancel"></button>
<button type="submit" class="btn btn-primary" data-i18n="common.save"></button>
</div>
</form>
</div>
</div>

<div class="modal hidden" id="modal-profile" role="dialog" aria-modal="true">
<div class="modal-backdrop"></div>
<div class="modal-box modal-lg">
<button class="modal-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
<div id="profile-view">
<h3 data-i18n="modal.user_profile"></h3>
<div class="profile-header" id="profile-header">
<div class="avatar-lg" id="profile-avatar"></div>
<div class="profile-info">
<h4 id="profile-name"></h4>
<div class="profile-meta"><code id="profile-id"></code><button class="btn btn-ghost btn-sm" id="profile-copy" data-i18n="modal.copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></div>
