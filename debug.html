<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Discord Manager - Debug Page</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #111; color: #0f0; }
        .ok { color: #0f0; }
        .err { color: #f00; }
        .warn { color: #ff0; }
        pre { background: #222; padding: 10px; overflow: auto; }
        button { padding: 10px 20px; margin: 5px; background: #0a0; color: #fff; border: none; cursor: pointer; }
        button:hover { background: #0c0; }
        #results { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Discord Manager - Bridge Debug</h1>
    <p>Base URL: <span id="baseUrl">http://127.0.0.1:8787</span></p>
    <button onclick="runAllTests()">Run All Tests</button>
    <button onclick="clearResults()">Clear</button>
    <div id="results"></div>

    <script>
        const BASE = 'http://127.0.0.1:8787';
        const log = document.getElementById('results');
        
        function add(msg, cls = '') {
            const div = document.createElement('div');
            div.className = cls;
            div.textContent = msg;
            log.appendChild(div);
        }
        
        function clearResults() { log.innerHTML = ''; }
        
        async function testFetch(url, label) {
            try {
                const r = await fetch(BASE + url);
                const text = await r.text();
                if (r.ok) {
                    add(`✓ ${label} (${r.status}): ${text.slice(0, 100)}...`, 'ok');
                    return JSON.parse(text);
                } else {
                    add(`✗ ${label} (${r.status}): ${text}`, 'err');
                }
            } catch (e) {
                add(`✗ ${label} ERROR: ${e.message}`, 'err');
            }
        }
        
        async function runAllTests() {
            clearResults();
            add('Testing bridge endpoints...');
            add('');
            
            // Test i18n
            await testFetch('/i18n/languages', '/i18n/languages');
            await testFetch('/i18n/locales/en', '/i18n/locales/en');
            await testFetch('/i18n/locales/zh', '/i18n/locales/zh');
            
            add('');
            add('Testing static files...');
            await testFetch('/styles.css', '/styles.css (first 200 chars)');
            await testFetch('/app.js', '/app.js (first 200 chars)');
            await testFetch('/index.html', '/index.html (first 200 chars)');
            
            add('');
            add('Testing if app.js loads without error...');
            try {
                const script = document.createElement('script');
                script.src = BASE + '/app.js';
                script.onload = () => add('✓ app.js loaded without syntax error', 'ok');
                script.onerror = () => add('✗ app.js failed to load', 'err');
                document.head.appendChild(script);
            } catch (e) {
                add(`✗ app.js load error: ${e.message}`, 'err');
            }
        }
    </script>
</body>
</html>
